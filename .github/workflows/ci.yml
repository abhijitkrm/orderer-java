name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: scripts/test.sh

  # Private sibling repos need a token with read access to them
  # (secrets.ORDERER_REPO_TOKEN); public ones work with the default token.
  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer
          path: upstream/orderer
          fetch-depth: 0
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - run: UPSTREAM_DIR=upstream/orderer scripts/vendored.sh

  # Both axes: orderer-java vs orderer-rust and vs matcher-java, via the spec repo's scripts.
  cross-impl:
    runs-on: ubuntu-latest
    env:
      ORDERER_JAVA_DIR: ${{ github.workspace }}
      ORDERER_RUST_DIR: ${{ github.workspace }}/upstream/orderer-rust
      MATCHER_JAVA_DIR: ${{ github.workspace }}/upstream/matcher-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer
          path: upstream/orderer
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/orderer-rust
          path: upstream/orderer-rust
          token: ${{ secrets.ORDERER_REPO_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: abhijitkrm/matcher-java
          ref: 20e563bc0186c6d52b2dbce64d4efce3fd244f3f
          path: upstream/matcher-java
      - uses: dtolnay/rust-toolchain@stable
      - run: upstream/orderer/scripts/diffuzz.sh 4 10000
      - run: upstream/orderer/scripts/e2e.sh
      - run: upstream/orderer/scripts/snapdiff.sh
